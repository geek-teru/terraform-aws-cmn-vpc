name: terraform-state-list
run-name: terraform-state-list - ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: 'target environment'
        required: true

permissions:
  id-token: write
  contents: read

jobs: 
  state-list:
    # only master branch
    if: ${{ github.ref == 'refs/heads/master' }}
    
    runs-on: ubuntu-latest
    
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}
    
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS login
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_CICD_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Resolve Terraform version
        id: terraform-version
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.terraform-version")" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}

      - name: terraform init
        run: terraform init -input=false
        id: init

      - name: terraform state list
        run: terraform state list -no-color
        id: state-list
