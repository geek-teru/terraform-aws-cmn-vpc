name: terraform-plan
run-name: terraform-plan

on:
  pull_request:
    branches: 
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:  
  plan:
    runs-on: ubuntu-latest    
    
    strategy:
      matrix:
        env: [dev, prd]

    environment: ${{ matrix.env }}

    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.env }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: AWS login
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_CICD_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Resolve Terraform version
        id: terraform-version
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.terraform-version")" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}

      - name: terraform fmt
        run: terraform fmt -check -recursive
        id: fmt

      - name: terraform init
        run: terraform init -input=false
        id: init

      - name: terraform validate
        run: terraform validate -no-color
        id: validate

      - name: terraform plan
        run: terraform plan -no-color -input=false
        id: plan