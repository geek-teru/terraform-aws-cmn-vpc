name: terraform-apply
run-name: terraform-apply - ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: 'target environment'
        required: true

permissions:
  id-token: write
  contents: read

jobs: 
  apply:
    # only default branch
    if: ${{ github.ref == 'refs/heads/main' }}
    
    runs-on: ubuntu-latest
    
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS login
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Resolve Terraform version
        id: terraform-version
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.terraform-version")" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}

      - name: terraform init
        run: terraform init -input=false
        id: init

      - name: terraform validate
        run: terraform validate -no-color
        id: validate

      - name: terraform apply
        run: terraform apply -auto-approve -no-color -input=false
        id: apply